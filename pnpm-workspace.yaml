packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  workerd: true
  protobufjs: false

minimumReleaseAge: 10080

overrides:
  typescript: "7.0.2"
  "alchemy>drizzle-orm": "0.45.4"
  "alchemy>drizzle-kit": "1.0.0-rc.4"
  vite@*: "catalog:"
  vitest@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
