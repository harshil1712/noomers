name: cd

# Manual-only deploy. Automated pushes used to deploy the base
# packages/server/wrangler.json — a placeholder config (dummy D1/stream
# ids, name `noomers`) — which would overwrite the production Worker.
# Real deployments go through scripts/deploy.mjs <env> after
# scripts/provision.mjs <env> has generated wrangler.<env>.json.
on:
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
            - uses: actions/setup-node@v4
              with:
                  node-version-file: "package.json"
            - uses: pnpm/action-setup@v4
            - run: pnpm install
            - run: pnpm turbo build
            # Manual dry-run only — real deploys use scripts/deploy.mjs.
            - run: echo "Use scripts/deploy.mjs <dev|prod> to deploy."
