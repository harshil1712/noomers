name: Deploy prod
on:
  push:
    branches: [main]
  # re-run from main after a production secret changes (the environment only allows main)
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      - run: vp install --frozen-lockfile
      - name: Read project config
        id: cfg
        run: |
          DOMAIN=$(grep -o 'domain: "[^"]*"' project.config.ts | head -1 | cut -d'"' -f2)
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
      - name: Cloudflare token preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cf-token-preflight.sh ${{ steps.cfg.outputs.domain }}
      - run: vp check
      - run: vp run -r test
      - run: vp run -r build
      - name: Record live Worker versions
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          for w in noomers-web noomers-site; do
            v=$(npx wrangler deployments status --name "$w" --json 2>/dev/null | jq -r '[.versions[] | select(.percentage == 100)][0].version_id // empty')
            echo "VER_${w//-/_}=$v" >> "$GITHUB_ENV"
            echo "$w live version: ${v:-<none>}"
          done
      - name: Deploy prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OWNER_ADMIN_EMAIL: ${{ secrets.OWNER_ADMIN_EMAIL }}
          SIGNUP_DISABLED: ${{ vars.SIGNUP_DISABLED }}
          # alchemy.run.ts gates prod resources (custom domains, real Turnstile
          # widget, email subdomain) on ALCHEMY_STAGE — required.
          ALCHEMY_STAGE: prod
        # CI has no terminal: --yes approves the plan (the reviewed PR is the
        # approval) and bootstraps Alchemy's state store on the first run.
        run: npx alchemy deploy --stage prod --yes
      - name: Post-deploy smoke
        id: smoke
        env:
          DOMAIN: ${{ steps.cfg.outputs.domain }}
        run: |
          set -e
          probe() { curl -s -o /dev/null -w "%{http_code}" --retry 6 --retry-delay 10 --retry-all-errors --max-time 20 "$1"; }
          c=$(probe "https://$DOMAIN/"); [ "$c" = 200 ] || exit 1
          c=$(probe "https://app.$DOMAIN/api/health"); [ "$c" = 200 ] || exit 1
      - name: Roll back on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fail=0
          for w in noomers-web noomers-site; do
            var="VER_${w//-/_}"; prev="${!var}"
            cur=$(npx wrangler deployments status --name "$w" --json 2>/dev/null \
              | jq -r '[.versions[] | select(.percentage == 100)][0].version_id // empty')
            if [ "$cur" = "$prev" ]; then
              echo "$w: unchanged (${cur:-none}) — skipped"
            elif [ -z "$prev" ]; then
              echo "$w: FAILED — no recorded version to roll back to (live: ${cur:-none})"; fail=1
            else
              if npx wrangler rollback "$prev" --name "$w" -m "smoke failed: run $GITHUB_RUN_ID" -y; then
                echo "$w: rolled back to $prev"
              else
                echo "$w: FAILED — rollback command failed"; fail=1
              fi
            fi
          done
          exit 1
