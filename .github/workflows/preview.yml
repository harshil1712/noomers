name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  pull-requests: write
concurrency: preview-pr-${{ github.event.pull_request.number }}
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    # same-repo PRs only; skip cleanly when CF secrets are absent
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      - run: vp install --frozen-lockfile
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy previews pr-${{ github.event.pull_request.number }}
        if: steps.secrets.outputs.missing != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NAME: pr-${{ github.event.pull_request.number }}
        # previews keep no sessions worth preserving: a throwaway auth secret per run
        run: BETTER_AUTH_SECRET=$(openssl rand -base64 32) npx alchemy deploy --stage pr-${{ github.event.pull_request.number }} --yes
      - name: Notice when secrets are missing
        if: steps.secrets.outputs.missing == 'true'
        run: echo "::notice::Cloudflare secrets missing — preview skipped"
      - name: Smoke preview URLs
        if: steps.secrets.outputs.missing != 'true'
        run: |
          W="https://pr-${{ github.event.pull_request.number }}-noomers-web.${{ secrets.WORKERS_DEV_SUBDOMAIN }}.workers.dev"
          S="https://pr-${{ github.event.pull_request.number }}-noomers-site.${{ secrets.WORKERS_DEV_SUBDOMAIN }}.workers.dev"
          for u in "$W/api/health" "$S/"; do code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$u"); echo "$u -> $code"; done
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      - run: vp install --frozen-lockfile
      - name: Delete previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NAME: pr-${{ github.event.pull_request.number }}
        run: BETTER_AUTH_SECRET=$(openssl rand -base64 32) npx alchemy destroy --stage pr-${{ github.event.pull_request.number }} --yes
